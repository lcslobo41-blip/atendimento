<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important}img{max-width:100%}</style>
<title>Atendimento FF Logística</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: um "aparelho" de 420px centralizado; uma pergunta por tela, faixa de segurança no topo, ticket de SS no final */
:root{
  --bg:#E7EAEE; --surface:#FFFFFF; --field:#F3F5F7; --ink:#15202B; --muted:#5E6B78; --line:#D3D9DF;
  --brand:#1B2A3A; --safety:#F2B705; --safety-ink:#1B2A3A; --ok:#2E7D4F; --focus:#2D6FB0;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E151C; --surface:#17212B; --field:#1F2B37; --ink:#E8EDF2; --muted:#9AA8B5; --line:#2C3A47;
  --brand:#0B1219; --safety:#F2B705; --safety-ink:#14202B; --ok:#4FB27A; --focus:#6FA8DC; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E151C; --surface:#17212B; --field:#1F2B37; --ink:#E8EDF2; --muted:#9AA8B5; --line:#2C3A47;
  --brand:#0B1219; --safety:#F2B705; --safety-ink:#14202B; --ok:#4FB27A; --focus:#6FA8DC; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);padding-inline:16px;padding-block:20px 40px}
.device{max-width:420px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;min-height:640px;display:flex;flex-direction:column}
.proto{max-width:420px;margin:0 auto 10px;font-size:12px;color:var(--muted);text-align:center}

/* topo */
.top{background:var(--brand);color:#fff;padding:14px 18px 0}
.top .row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.logo{font:800 22px/1 var(--display);letter-spacing:.02em}
.logo span{color:var(--safety)}
.back{background:none;border:0;color:#fff;font:600 14px var(--body);cursor:pointer;padding:6px 0;opacity:.85}
.back[hidden]{display:none}
.stripe{height:10px;margin:12px -18px 0;background:repeating-linear-gradient(-45deg,var(--safety) 0 12px,var(--brand) 12px 24px)}
.progress{height:4px;background:var(--line)}
.progress i{display:block;height:100%;width:0;background:var(--safety);transition:width .35s ease}

/* telas */
main{flex:1;padding:22px 20px 24px;display:flex;flex-direction:column}
.screen{display:flex;flex-direction:column;gap:14px;flex:1;animation:in .3s ease}
@keyframes in{from{opacity:.4;transform:translateX(12px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.screen{animation:none}.progress i{transition:none}}
.step{font:600 12px var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
h1{font:700 34px/1.05 var(--display);margin:0;text-wrap:balance}
h2{font:700 27px/1.1 var(--display);margin:0;text-wrap:balance}
p{margin:0}
.lead{color:var(--muted);font-size:16px}

/* opções */
.opts{display:grid;gap:10px}
.opts.two{grid-template-columns:1fr 1fr}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--field);border:2px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;color:var(--ink);font:600 17px var(--body);transition:border-color .15s, transform .1s}
.opts.two .opt{flex-direction:column;align-items:flex-start;gap:8px}
.opt:hover{border-color:var(--safety)}
.opt:active{transform:scale(.98)}
.opt small{display:block;font:400 14px/1.35 var(--body);color:var(--muted);margin-top:2px}
.opt svg{flex:none;width:40px;height:40px}
.opt .ico{stroke:var(--ink);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.opt .ico .fill{fill:var(--safety);stroke:none}
.opt.sel{border-color:var(--safety);background:color-mix(in srgb,var(--safety) 14%,var(--field))}

/* campos */
label{display:block;font-weight:600;font-size:14px;margin-bottom:4px}
.req{color:#C8372D}
input,textarea{width:100%;font:inherit;color:var(--ink);background:var(--field);border:1.5px solid var(--line);border-radius:10px;padding:12px}
textarea{min-height:120px;resize:vertical}
input:focus,textarea:focus,button:focus-visible{outline:3px solid var(--focus);outline-offset:1px}
.fields{display:grid;gap:12px}
.hint{font-size:13px;color:var(--muted);margin-top:4px}
.err{font-size:13px;color:#C8372D;min-height:1em}

/* placa TAG */
.tagplate{display:flex;align-items:center;gap:12px;background:var(--field);border:1px dashed var(--line);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--muted)}
.plate{flex:none;font:500 15px var(--mono);background:#fff;color:#15202B;border:2px solid #15202B;border-radius:4px;padding:3px 8px;letter-spacing:.06em}

/* fotos */
.drop{display:flex;flex-direction:column;align-items:center;gap:6px;border:2px dashed var(--line);border-radius:12px;padding:16px;text-align:center;cursor:pointer;color:var(--muted);font-size:14px}
.drop strong{color:var(--ink)}
.mbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mb{display:flex;align-items:center;gap:8px;margin:0;background:var(--field);border:2px solid var(--line);border-radius:10px;padding:12px;cursor:pointer;font:600 15px var(--body);color:var(--ink)}
.mb:active{border-color:var(--safety)}
.thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.thumbs img,.thumbs video{aspect-ratio:1;object-fit:cover;border-radius:8px;width:100%;background:var(--brand)}
.mth{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;background:var(--brand)}
.mth img,.mth video{width:100%;height:100%;object-fit:cover;display:block}
.mth .ph{display:flex;align-items:center;justify-content:center;width:100%;height:100%;font-size:28px}
.mth .tg{position:absolute;left:4px;top:4px;font:600 11px var(--body);background:var(--brand);color:#fff;border-radius:4px;padding:1px 5px}
.mth .tg:empty{display:none}
.mth .st{position:absolute;left:0;right:0;bottom:0;font:600 11px var(--body);text-align:center;padding:3px 2px;background:rgba(21,32,43,.78);color:#fff}
.mth.ok .st{background:#1E7D45}
.mth.erro{cursor:pointer;outline:2px solid #C0392B}
.mth.erro .st{background:#C0392B}
.mth .rm{position:absolute;right:3px;top:3px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font:700 14px/22px var(--body);cursor:pointer;padding:0}

/* botões */
.cta{margin-top:auto;display:grid;gap:10px;padding-top:10px}
.btn{width:100%;font:700 19px var(--display);letter-spacing:.04em;text-transform:uppercase;border:0;border-radius:10px;padding:15px;cursor:pointer;background:var(--safety);color:var(--safety-ink)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line);font-size:16px}
.btn:disabled{opacity:.55;cursor:default}

/* revisão */
dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;font-size:15px}
dt{color:var(--muted)}
dd{margin:0;font-weight:500;min-width:0;overflow-wrap:anywhere}
.box{background:var(--field);border-radius:12px;padding:14px}

/* processando */
.proc{display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center;flex:1;justify-content:center}
/* animação: bateria carregando (vista lateral) */
.charge{width:100%;max-width:340px;height:auto;display:block}
.charge .wl{fill:#F6F7F9}.charge .wb{fill:#0C427E}.charge .fl{fill:#E4E8EC}
.charge .qd{fill:none;stroke:#D9DEE3;stroke-width:1}
.charge .sh{fill:#15202B;opacity:.08}
.charge .stc{font:800 1px "Barlow Condensed","Arial Narrow",Arial,sans-serif;fill:#1D232A;letter-spacing:.05em}
.charge .cab{stroke:#1B1F24;stroke-width:3.2;fill:none;stroke-linecap:round}
.charge .flow{stroke:#F2B705;stroke-width:1.6;fill:none;stroke-linecap:round;stroke-dasharray:3 7;animation:flow .8s linear infinite}
.charge .bolt{fill:#F2B705;animation:led 1.4s ease-in-out infinite}
.charge .cell{opacity:.12;fill:#D64545;animation:cor 5s linear infinite}
.charge .k1{animation-name:cor,s1}.charge .k2{animation-name:cor,s2}.charge .k3{animation-name:cor,s3}.charge .k4{animation-name:cor,s4}.charge .k5{animation-name:cor,s5}
@keyframes cor{0%,18%{fill:#E04848}38%,58%{fill:#F2B705}76%,100%{fill:#3FB26A}}
@keyframes s1{0%,2%{opacity:.12}5%,94%{opacity:1}100%{opacity:.12}}
@keyframes s2{0%,19%{opacity:.12}22%,94%{opacity:1}100%{opacity:.12}}
@keyframes s3{0%,37%{opacity:.12}40%,94%{opacity:1}100%{opacity:.12}}
@keyframes s4{0%,55%{opacity:.12}58%,94%{opacity:1}100%{opacity:.12}}
@keyframes s5{0%,73%{opacity:.12}76%,94%{opacity:1}100%{opacity:.12}}
@keyframes flow{to{stroke-dashoffset:-20}}
@keyframes led{0%,100%{opacity:1}50%{opacity:.25}}
@media (prefers-reduced-motion: reduce){.charge .flow,.charge .bolt{animation-duration:4s}.charge .cell{animation-duration:10s}}
@keyframes spin{to{transform:rotate(360deg)}}
.checks{list-style:none;padding:0;margin:0;display:grid;gap:8px;text-align:left;font-size:15px}
.checks li{color:var(--muted);display:flex;gap:8px;align-items:center}
.checks li.done{color:var(--ink)}
.checks li::before{content:"";width:16px;height:16px;border-radius:50%;border:2px solid var(--line);flex:none}
.checks li.done::before{background:var(--ok);border-color:var(--ok)}
.checks li.ativo:not(.done){color:var(--ink);font-weight:600}
.checks li.ativo:not(.done)::before{border-color:var(--safety);border-top-color:transparent;animation:spin 1s linear infinite}

/* ticket */
.ticket{border:2px solid var(--ink);border-radius:12px;overflow:hidden}
.ticket .stripe{margin:0}
.ticket .in{padding:16px}
.ssno{font:800 40px/1 var(--display);letter-spacing:.02em}
.ssno small{display:block;font:600 12px var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.copy{background:none;border:1.5px solid var(--line);border-radius:8px;padding:6px 10px;font:600 13px var(--body);color:var(--ink);cursor:pointer}
.thanks{font-size:15px;color:var(--muted)}
.ex{font-size:11px;color:var(--muted);font-style:italic}

/* v24: falar com um atendente */
.humano{padding:4px 20px 18px;text-align:center}
.humano button{background:none;border:0;color:var(--muted);font:600 14px var(--body);text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:8px}
.humano button:hover{color:var(--ink)}
.sheet{position:fixed;inset:0;background:rgba(10,18,26,.55);display:flex;align-items:flex-end;justify-content:center;z-index:50;padding:16px}
.sheet .pn{background:var(--surface);color:var(--ink);width:100%;max-width:420px;border-radius:16px;padding:20px;display:grid;gap:12px;animation:in .25s ease}
.sheet h3{font:700 24px/1.1 var(--display);margin:0}
.sheet .bth{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:14px;border-radius:12px;border:0;font:700 17px var(--body);cursor:pointer;text-decoration:none}
.sheet .wa{background:#25D366;color:#fff}
.sheet .tl{background:var(--brand);color:#fff}
.sheet .vt{background:none;border:1.5px solid var(--line);color:var(--ink)}
.sheet .num{font:500 13px var(--mono);color:var(--muted);text-align:center}
</style>

</head>
<body>
<p class="proto">AMBIENTE DE TESTE · a SS é salva com "TESTE - DESCONSIDERAR"</p>
<div class="device">
  <header class="top">
    <div class="row">
      <button class="back" id="back" hidden>‹ Voltar</button>
      <div class="logo">FF <span>LOGÍSTICA</span></div>
    </div>
    <div class="stripe"></div>
  </header>
  <div class="progress"><i id="bar"></i></div>
  <main id="app"></main>
  <div class="humano" id="humano"><button type="button" onclick="abrirHumano()">Prefere falar com um atendente?</button></div>
</div>
<div class="sheet" id="sheet" hidden onclick="if(event.target===this)fecharHumano()">
  <div class="pn" role="dialog" aria-modal="true" aria-labelledby="shT">
    <h3 id="shT">Falar com um atendente</h3>
    <p class="lead" id="shTx">Escolha como prefere falar com a nossa equipe. O que você já preencheu segue junto na mensagem.</p>
    <a class="bth wa" id="shWa" href="#" target="_blank" rel="noopener" onclick="pedirHumano('WhatsApp')">💬 Conversar pelo WhatsApp</a>
    <a class="bth tl" id="shTl" href="#" onclick="pedirHumano('Ligação')">📞 Ligar para a FF Logística</a>
    <p class="num" id="shNum"></p>
    <button class="bth vt" type="button" onclick="fecharHumano()">Voltar ao formulário</button>
  </div>
</div>

<script>
const ICON = {
  quote:'<svg viewBox="0 0 40 40" class="ico"><rect x="8" y="5" width="24" height="30" rx="2"/><path d="M13 13h14M13 19h14M13 25h8"/><circle class="fill" cx="29" cy="30" r="6"/></svg>',
  tool:'<svg viewBox="0 0 40 40" class="ico"><path d="M25 6a8 8 0 0 0-8 11L6 28l6 6 11-11a8 8 0 0 0 11-8l-5 5-5-1-1-5z"/><circle class="fill" cx="9" cy="31" r="2.5"/></svg>',
  rent:'<svg viewBox="0 0 40 40" class="ico"><path d="M6 18 20 7l14 11v15H6z"/><rect class="fill" x="15" y="22" width="10" height="11"/></svg>',
  own:'<svg viewBox="0 0 40 40" class="ico"><circle cx="20" cy="14" r="6"/><path d="M8 34c1-7 6-11 12-11s11 4 12 11"/><circle class="fill" cx="30" cy="10" r="4"/></svg>',
  fork:'<svg viewBox="0 0 40 40" class="ico"><path d="M8 28V12h10l4 8v8"/><path d="M28 6v24h8"/><circle cx="11" cy="31" r="3"/><circle cx="21" cy="31" r="3"/><rect class="fill" x="10" y="14" width="6" height="5"/></svg>',
  battery:'<svg viewBox="0 0 40 40" class="ico"><rect x="6" y="11" width="26" height="20" rx="2"/><path d="M32 17h3v8h-3"/><path class="fill" d="M20 14l-5 8h5l-2 6 6-9h-5z"/></svg>',
  charger:'<svg viewBox="0 0 40 40" class="ico"><rect x="9" y="6" width="18" height="28" rx="2"/><path d="M27 20h5v8"/><path d="M14 34v2M22 34v2"/><path class="fill" d="M19 11l-4 7h4l-2 6 6-8h-4z"/></svg>',
  elec:'<svg viewBox="0 0 40 40" class="ico"><path class="fill" d="M22 4 9 22h9l-3 14 15-20h-9z"/></svg>',
  hyd:'<svg viewBox="0 0 40 40" class="ico"><path d="M20 6s-10 12-10 19a10 10 0 0 0 20 0C30 18 20 6 20 6z"/><path class="fill" d="M14 25a6 6 0 0 0 12 0z"/></svg>',
  mech:'<svg viewBox="0 0 40 40" class="ico"><circle cx="20" cy="20" r="6"/><path d="M20 5v5M20 30v5M5 20h5M30 20h5M9 9l4 4M27 27l4 4M31 9l-4 4M13 27l-4 4"/><circle class="fill" cx="20" cy="20" r="2.5"/></svg>',
  stop:'<svg viewBox="0 0 40 40" class="ico"><path d="M14 5h12l9 9v12l-9 9H14l-9-9V14z"/><rect class="fill" x="13" y="18" width="14" height="4"/></svg>',
  cart:'<svg viewBox="0 0 40 40" class="ico"><path d="M5 27h28"/><path d="M31 27V12"/><rect class="fill" x="9" y="14" width="18" height="11" rx="1.5"/><circle cx="11" cy="31" r="3"/><circle cx="27" cy="31" r="3"/></svg>',
  check:'<svg viewBox="0 0 40 40" class="ico"><rect x="7" y="7" width="26" height="26" rx="4"/><path class="tick" d="M13 20l5 5 10-11"/></svg>'
};

// ---------------------------------------------------------------- v25: nuvem (Google Apps Script)
const API = 'https://script.google.com/macros/s/AKfycby-4TprXJgw1HpQZ0F5Qvgy7kdT0G9QqZ2wJRATFL3vZsctJomjxKTZNK6Zoy3O2Fmu/exec';                 // preenchido por gerar_site_v25_TESTE.py
const QR_TAG = (new URLSearchParams(location.search).get('tag') || '').toUpperCase().replace(/[^A-Z0-9\-]/g, '').slice(0, 12);
async function apiGet(api, q){
  const u = API + '?api=' + api + Object.entries(q || {}).map(([k, v]) => '&' + k + '=' + encodeURIComponent(v || '')).join('');
  const r = await fetch(u); return r.json();
}
async function apiPost(acao, obj, extra){
  const r = await fetch(API, Object.assign({method:'POST', body: JSON.stringify(Object.assign({acao}, obj))}, extra || {}));
  return r.json();
}

// ---------------------------------------------------------------- estado
const CAMPOS_ITEM = ['tag','marca','modelo','serie','parado','cat','relato','midias','cli_sis','cli_conf'];
const S = {fluxo:null, origem:'', equips:[], k:0, itens:[], empresa:'', nome:'', cel:'', email:'', necessidade:'',
           tag:'', marca:'', modelo:'', serie:'', parado:'', cat:'', relato:'', midias:[], cli_sis:'', cli_conf:''};
const hist = [];
let RES = [], _prot = null;
const app = document.getElementById('app'), bar = document.getElementById('bar'), backBtn = document.getElementById('back');
const esc = t => String(t ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const primeiro = n => esc((n || '').trim().split(/\s+/)[0] || 'cliente');
const ORDEM_EQ = ['EMP','BAT','CAR','CRB'];
const ROT = {LOC:'Locação FF Logística', PROP:'Equipamento próprio', EMP:'Empilhadeira', BAT:'Bateria', CAR:'Carregador de baterias', CRB:'Carrinho de baterias',
  ELE:'Elétrico', HID:'Hidráulico', MEC:'Mecânico', SIM:'Sim', NAO:'Não', COR:'Corretiva', PRE:'Preventiva', VIS:'Visita técnica'};
const EX_TAG = {EMP:'M148', BAT:'B33', CAR:'C06', CRB:'CB01'};
const DA = {EMP:'da empilhadeira', BAT:'da bateria', CAR:'do carregador', CRB:'do carrinho de baterias'};

function itemVazio(){ return {tag:'', marca:'', modelo:'', serie:'', parado:'', cat:'', relato:'', midias:[], cli_sis:'', cli_conf:''}; }
function salvarItem(){ const it = {}; CAMPOS_ITEM.forEach(c => it[c] = S[c]); S.itens[S.k] = it; }
function carregarItem(k){ const it = S.itens[k] || itemVazio(); CAMPOS_ITEM.forEach(c => S[c] = Array.isArray(it[c]) ? [...it[c]] : it[c]); }
const eqAtual = () => S.equips[S.k];
const multi = () => S.equips.length > 1;
const etapa = () => multi() ? `Equipamento ${S.k + 1} de ${S.equips.length} · ${ROT[eqAtual()]}` : `Atendimento · ${ROT[eqAtual()] || ''}`;
// v15: TAG em estêncil na animação (só Locação FF; equipamento próprio sem TAG não mostra plaqueta)
function tagTxt(eq){
  if (S.origem !== 'LOC') return '';
  const i = S.equips.findIndex((e, k) => e === eq && S.itens[k] && S.itens[k].tag);
  return i < 0 ? '' : esc(String(S.itens[i].tag).toUpperCase().replace(/\s+/g,'').slice(0,7));
}
function tagEmp(m){ const t = tagTxt('EMP'); return t ? `<text class="stc" transform="${m}" style="font-size:13px">${t}</text>` : ''; }
function tagBat(m){ const t = tagTxt('BAT'); return t ? `<text class="stc" transform="${m}" style="font-size:10px">${t}</text>` : ''; }
function tagCar(m){ const t = tagTxt('CAR'); return t ? `<text class="stc" transform="${m}" style="font-size:7.5px">${t}</text>` : ''; }
const identItem = it => S.origem === 'LOC' ? (it.tag ? `TAG ${it.tag}` : it.serie ? `série ${it.serie}` : 'sem TAG') : `${it.marca} ${it.modelo}`.trim();

// ---------------------------------------------------------------- navegação
const POR_ITEM = ['ident','parado','cat','relato'];
function progresso(id){
  if (id === 'inicio') return 0;
  if (id === 'ajuda') return 8;
  if (S.fluxo === 'or') return 50;
  if (id === 'origem') return 14;
  if (id === 'equip') return 20;
  const i = POR_ITEM.indexOf(['confemp','tagnf'].includes(id) ? 'ident' : id);
  if (i >= 0) { const n = Math.max(S.equips.length, 1); return 22 + 58 * ((S.k * 4 + i + 1) / (n * 4)); }
  return {dados: 86, revisao: 94}[id] ?? 100;
}
function go(id, push = true){
  if (id === '__fluxo') id = S.fluxo === 'or' ? 'orc' : 'origem';
  if (id === '__cat') { if (eqAtual() === 'EMP') id = 'cat'; else { S.cat = ''; id = 'relato'; } }   // v17: só empilhadeira
  if (id === '__proxItem') {
    salvarItem();
    if (S.k < S.equips.length - 1) { if (push && app.dataset.cur) hist.push({id: app.dataset.cur, k: S.k}); S.k++; carregarItem(S.k); render('ident'); return; }
    id = 'dados';
  }
  if (push && app.dataset.cur) hist.push({id: app.dataset.cur, k: S.k});
  render(id);
}
const CHAVE = 'ff_atend_v26', VALIDADE = 2 * 60 * 60 * 1000;
let RECARREGOU = false;
function midiaLeve(m){ return {lid:m.lid, tipo:m.tipo, nome:m.nome, seg:m.seg, status:'ok', pct:100, tent:0, mid:m.mid}; }
function salvarEstado(){
  try {
    const cur = app.dataset.cur || '';

// ---------------------------------------------------------------- fotos e vídeo (v11)
// Cada arquivo sobe sozinho assim que é escolhido (até 5 tentativas). A SS não depende da mídia.
let _lid = 0;
const LIM_FOTOS = 4, LIM_VIDEO_SEG = 30;
const RX_VIDEO = /\.(mp4|mov|3gp|3g2|webm|m4v|mkv|avi|mpe?g|wmv)$/i, RX_FOTO = /\.(jpe?g|png|heic|heif|webp|gif|bmp|tiff?)$/i;
const fotosDe = it => it.midias.filter(m => m.tipo === 'foto');
const videoDe = it => it.midias.find(m => m.tipo === 'video');
function statusTxt(m){ return m.status === 'ok' ? '✓ recebido' : m.status === 'erro' ? '⚠ tocar p/ reenviar' : (m.tent > 1 ? 'tentando de novo… ' : 'enviando ') + m.pct + '%'; }
function thumbHtml(m){
  const vis = m.thumb ? (m.tipo === 'video' ? `<video src="${m.thumb}" muted playsinline preload="metadata"></video>` : `<img src="${m.thumb}" alt="Foto anexada">`)
                      : `<div class="ph">${m.tipo === 'video' ? '🎬' : '📷'}</div>`;
  return `<div class="mth ${m.status}" id="m${m.lid}" data-lid="${m.lid}">${vis}<span class="tg">${m.tipo === 'video' ? '▶ ' + (m.seg ? m.seg + 's' : 'vídeo') : ''}</span>` +
         `<span class="st">${statusTxt(m)}</span><button type="button" class="rm" data-rm="${m.lid}" aria-label="Remover">×</button></div>`;
}
function thumbsHtml(it){ return it.midias.map(thumbHtml).join(''); }
function midiaTxt(it){
  const f = fotosDe(it).length, v = videoDe(it), err = it.midias.filter(m => m.status === 'erro').length;
  return (f ? f + ' foto(s)' : 'nenhuma foto') + (v ? ' + 1 vídeo' + (v.seg ? ' (' + v.seg + 's)' : '') : '') + (err ? ` · ${err} com falha no envio` : '');
}
function atualizarThumb(m){
  const el = document.getElementById('m' + m.lid); if (!el) return;
  el.className = 'mth ' + m.status; el.querySelector('.st').textContent = statusTxt(m);
}
function todasMidias(){
  const set = new Set(); S.itens.forEach(it => it && it.midias && it.midias.forEach(m => set.add(m))); S.midias.forEach(m => set.add(m));
  return [...set].filter(m => !m.removida);
}
// v25: cada arquivo sobe em partes de 2 MB para a nuvem; parte já enviada não sobe de novo
const PARTE = 2 * 1024 * 1024;
const novoMid = () => [...crypto.getRandomValues(new Uint8Array(6))].map(b => b.toString(16).padStart(2, '0')).join('');
function b64Parte(blob){
  return new Promise((res, rej) => { const fr = new FileReader();
    fr.onload = () => res(String(fr.result).split(',')[1] || ''); fr.onerror = rej; fr.readAsDataURL(blob); });
}
function postParte(corpo){
  // sem x.upload.onprogress: ouvir o progresso faria o navegador pedir "preflight", que o Apps Script não aceita
  return new Promise((res, rej) => {
    const x = new XMLHttpRequest(); x.open('POST', API); x.timeout = 5 * 60 * 1000;
    x.onload = () => { let j = {}; try { j = JSON.parse(x.responseText); } catch (e) {} j.ok ? res(j) : rej(new Error(j.erro || 'falha')); };
    x.onerror = () => rej(new Error('rede')); x.ontimeout = () => rej(new Error('tempo'));
    x.send(corpo);
  });
}
async function subir(m){
  if (m.removida || m.subindo) return;
  m.subindo = true; m.status = 'enviando'; m.tent++; atualizarThumb(m);
  if (!m.mid) m.mid = novoMid();
  m.feitas = m.feitas || new Set();
  const total = Math.max(1, Math.ceil(m.blob.size / PARTE));
  try {
    if (total > 40) throw new Error('arquivo grande demais');
    for (let i = 0; i < total; i++) {
      if (m.removida) return;
      if (m.feitas.has(i)) continue;
      m.pct = Math.min(95, Math.round((m.feitas.size + 0.3) * 100 / total)); atualizarThumb(m);
      const b64 = await b64Parte(m.blob.slice(i * PARTE, (i + 1) * PARTE));
      await postParte(JSON.stringify({acao:'midia_parte', mid:m.mid, parte:i, total, nome:m.nome, mime:m.blob.type || '',
                                      tipo:m.tipo, bytes:m.blob.size, b64}));
      m.feitas.add(i);
      m.pct = Math.min(99, Math.round(m.feitas.size * 100 / total)); atualizarThumb(m);
    }
    m.subindo = false; m.status = 'ok'; m.pct = 100; atualizarThumb(m);
  } catch (e) {
    m.subindo = false;
    if (m.removida) return;
    if (m.tent < 5 && String(e.message) !== 'arquivo grande demais') { m.status = 'enviando'; atualizarThumb(m); setTimeout(() => subir(m), 2000 * m.tent); }
    else { m.status = 'erro'; atualizarThumb(m); }
  }
}
function reenviar(m){ m.tent = 0; subir(m); }
window.addEventListener('online', () => todasMidias().filter(m => m.status === 'erro').forEach(reenviar));
function addMidia(tipo, blob, nome, thumb, seg){
  const m = {lid: ++_lid, tipo, blob, nome, thumb, seg, status: 'enviando', pct: 0, tent: 0, mid: ''};
  S.midias.push(m);
  const th = document.getElementById('thumbs'); if (th) th.insertAdjacentHTML('beforeend', thumbHtml(m));
  subir(m);
}
async function reduzirFoto(f){
  // reduz no próprio celular (JPG, maior lado 1600 px); se o navegador não conseguir abrir (ex.: HEIC no PC), sobe o original
  try {
    let bmp;
    try { bmp = await createImageBitmap(f, {imageOrientation: 'from-image'}); } catch (e) { bmp = await createImageBitmap(f); }
    const k = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas'); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    const b = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.85));
    if (b && b.size > 0) return b;
  } catch (e) {}
  return null;
}
function lerDuracao(f){
  return new Promise(res => {
    const url = URL.createObjectURL(f), v = document.createElement('video');
    let feito = false; const fim = (seg, ok) => { if (feito) return; feito = true; res({url: ok ? url : null, seg}); if (!ok) URL.revokeObjectURL(url); };
    v.preload = 'metadata'; v.muted = true;
    v.onloadedmetadata = () => fim(isFinite(v.duration) ? Math.round(v.duration) : null, true);
    v.onerror = () => fim(null, false);
    setTimeout(() => fim(null, false), 5000);
    v.src = url;
  });
}
async function escolherArquivos(lista){
  const errm = document.getElementById('errmid'); const msgs = [];
  for (const f of lista) {
    const ehVideo = (f.type || '').startsWith('video/') || RX_VIDEO.test(f.name);
    const ehFoto = !ehVideo && ((f.type || '').startsWith('image/') || RX_FOTO.test(f.name));
    if (ehVideo) {
      if (videoDe(S)) { msgs.push('Você já adicionou um vídeo. Envie apenas 1 vídeo por equipamento.'); continue; }
      const {url, seg} = await lerDuracao(f);
      if (seg && seg > LIM_VIDEO_SEG + 1) { msgs.push(`Este vídeo tem ${seg} segundos. Grave um trecho de até ${LIM_VIDEO_SEG} segundos mostrando o problema.`); if (url) URL.revokeObjectURL(url); continue; }
      addMidia('video', f, f.name, url, seg);
    } else if (ehFoto) {
      if (fotosDe(S).length >= LIM_FOTOS) { msgs.push(`Limite de ${LIM_FOTOS} fotos atingido.`); continue; }
      const b = await reduzirFoto(f);
      if (b) addMidia('foto', b, f.name.replace(/\.[^.]+$/, '') + '.jpg', URL.createObjectURL(b), null);
      else addMidia('foto', f, f.name, null, null);
    } else {
      msgs.push(`Não reconhecemos o arquivo "${f.name}". Envie foto ou vídeo.`);
    }
  }
  if (errm) errm.textContent = msgs.join(' ');
}

// ---------------------------------------------------------------- v24: falar com um atendente
const FONE_FF = '5521981038612';            // preenchido pelo programa (abrir_ss_v24_TESTE.py)
const FONE_FF_TXT = '(21) 98103-8612';
const linkWa = t => 'https://wa.me/' + FONE_FF + '?text=' + encodeURIComponent(t);
function resumoHumano(){
  const tela = app.dataset.cur || '';
  if (POR_ITEM.includes(tela)) { try { salvarItem(); } catch(e){} }
  const eqs = S.equips.map((e, i) => {
    const it = S.itens[i] || {};
    const id = S.origem === 'LOC' ? (it.tag ? 'TAG ' + it.tag : '') : `${it.marca || ''} ${it.modelo || ''}`.trim();
    return [ROT[e], id, it.relato ? '"' + it.relato + '"' : ''].filter(Boolean).join(' · ');
  });
  const ss = RES.filter(r => r.numero_ss).map(r => r.numero_ss);
  return {tela, nome: S.nome, empresa: S.empresa, celular: S.cel,
          fluxo: S.fluxo === 'or' ? 'Orçamento' : S.fluxo ? 'Atendimento técnico' : '',
          origem: ROT[S.origem] || '', equipamentos: eqs, ss};
}
function msgHumano(midia){
  const r = resumoHumano(), L = [];
  L.push(midia ? 'Olá! Segue foto/vídeo da minha solicitação de manutenção.' : 'Olá! Gostaria de falar com um atendente.');
  if (r.nome) L.push('Nome: ' + r.nome);
  if (r.empresa) L.push('Empresa: ' + r.empresa);
  if (r.fluxo) L.push('Assunto: ' + r.fluxo + (r.origem ? ' (' + r.origem + ')' : ''));
  r.equipamentos.forEach(e => L.push('Equipamento: ' + e));
  if (r.ss.length) L.push('SS nº ' + r.ss.join(', '));
  return L.join('\n');
}
function abrirHumano(){
  document.getElementById('shWa').href = linkWa(msgHumano(false));
  document.getElementById('shTl').href = 'tel:+' + FONE_FF;
  document.getElementById('shNum').textContent = FONE_FF_TXT;
  document.getElementById('sheet').hidden = false;
}
function fecharHumano(){ document.getElementById('sheet').hidden = true; }
function pedirHumano(canal){
  try {
    apiPost('humano', {dados: Object.assign({canal}, resumoHumano())}, {keepalive:true}).catch(() => {});
  } catch(e){}
  setTimeout(fecharHumano, 400);
}

let ACOMP = null;
function linkAcomp(){   // SS reais deste atendimento para a simulação: EMP_M148_9986088_P~BAT_B012_9986089
  return S.itens.map((it, i) => {
    const r = RES[i] || {};
    if (!r.numero_ss) return '';
    const tag = String(it.tag || it.serie || '').toUpperCase().replace(/[^A-Z0-9]/g, '') || 'semTAG';
    return [S.equips[i], tag, r.numero_ss].concat(it.parado === 'SIM' ? ['P'] : []).join('_');
  }).filter(Boolean).join('~');
}   // v18: resposta à pergunta de acompanhamento (null = ainda não respondeu)

}
async function identLoc(){
  ler(['tag','serie']); S.tag = S.tag.toUpperCase(); S.serie = S.serie.toUpperCase();
  if (!S.tag && !S.serie) {
    if (eqAtual() === 'CRB') { S.cli_sis = ''; S.cli_conf = ''; go('parado'); return; }   // v17: carrinho sem TAG segue (SS no NI00)
    document.getElementById('err').textContent = 'Informe a TAG (nº da frota FF) ou o nº de série.'; document.getElementById('tag').focus(); return; }
  // v16: busca a empresa do equipamento no cadastro (Sismetro) e pede confirmação
  const btn = document.querySelector('.cta .btn'); if (btn) { btn.disabled = true; btn.textContent = 'Localizando…'; }
  let nome = '', existe = true;
  try {
    const r = await apiGet('tag', {tag: S.tag, serie: S.serie});
    nome = (r && r.ok && r.cliente) ? r.cliente : '';
    existe = !(r && r.existe === false);
  } catch (e) { nome = ''; existe = true; }
  S.cli_sis = nome; S.cli_conf = '';
  // v21: TAG/série não encontrada no cadastro -> pede para o cliente conferir (pode corrigir ou seguir)
  if (!existe && S.tagnf_ok !== (S.tag + '|' + S.serie)) { go('tagnf'); return; }
  if (!nome) { go('parado'); return; }
  // v19: a confirmação da empresa aparece só no 1º equipamento do atendimento
  if (S.k > 0) {
    const p = S.itens[0];
    // v20: outra empresa no cadastro -> marca DIF para o ADM revisar (nunca aparece para o cliente)
    S.cli_conf = (p && p.cli_conf === 'SIM' && p.cli_sis === nome) ? 'SIM' : (p && p.cli_sis && p.cli_sis !== nome ? 'DIF' : '');
    go('parado'); return;
  }
  go('confemp');
}

function tagSeguir(){ S.tagnf_ok = S.tag + '|' + S.serie; identLoc(); }   // v21: segue -> SS no NI00 + alerta ao ADM

async function dadosOk(btn){
  if (!validar(precisaEmpresa() ? ['empresa','cel'] : ['cel'])) return;
  ler(['email']);
  S.emp_check = '';
  if (!precisaEmpresa()) { go('revisao'); return; }
  if (S.emp_ok_nome === S.empresa) { go('revisao'); return; }
  btn.disabled = true; btn.textContent = 'Conferindo…';
  let r = null;
  try { r = await apiGet('empresa', {nome: S.empresa}); } catch (e) { r = null; }
  btn.disabled = false; btn.textContent = 'Revisar';
  if (!r || r.status === 'ok') { if (r && r.nome) S.empresa = r.nome; S.emp_check = 'OK'; S.emp_ok_nome = S.empresa; go('revisao'); return; }
  if (r.status === 'sugestao') { S.emp_sug = r.sugestao; go('empsug'); return; }
  go('empnf');
}

// v26: nome próprio – 1ª letra maiúscula e demais minúsculas (Luis Lobo, Maria da Silva)
function nomeProprio(t){
  const MIN = ['da','de','do','das','dos','e','di','du'];
  return String(t || '').trim().replace(/\s+/g, ' ').toLocaleLowerCase('pt-BR').split(' ').map((p, i) =>
    (i > 0 && MIN.includes(p)) ? p : p.split('-').map(q => q.charAt(0).toLocaleUpperCase('pt-BR') + q.slice(1)).join('-')).join(' ');
}

  try { sessionStorage.removeItem(CHAVE); localStorage.removeItem(CHAVE); } catch (e) {}
  const keep = {nome: S.nome, empresa: S.empresa, cel: S.cel, email: S.email};
  Object.assign(S, {fluxo:null, origem:'', equips:[], k:0, itens:[], necessidade:''}, itemVazio(), keep);
  RES = []; _prot = null; ACOMP = null; hist.length = 0; app.dataset.cur = ''; render('ajuda');
}

const dormir = ms => new Promise(r => setTimeout(r, ms));
async function esperarMidias(){
  // reenvia o que falhou e espera até 3 min; o que não chegar segue como "não chegou" (a SS abre do mesmo jeito)
  todasMidias().filter(m => m.status === 'erro').forEach(reenviar);
  const st = document.getElementById('midst'), t0 = Date.now();
  let pend = todasMidias().filter(m => m.status === 'enviando');
  while (pend.length && Date.now() - t0 < 180000) {
    const pct = Math.round(pend.reduce((a, m) => a + m.pct, 0) / pend.length);
    if (st) st.textContent = `Enviando fotos e vídeo… ${pct}% (${pend.length} arquivo(s))`;
    await dormir(500);
    pend = todasMidias().filter(m => m.status === 'enviando');
  }
  if (st) st.textContent = '';
}
let r_falhas = 0;
async function enviarItens(){
  RES = []; r_falhas = 0;
  await esperarMidias();
  let online = false;
  for (let i = 0; i < S.itens.length; i++) {
    const it = S.itens[i], li = document.getElementById('ck' + i);
    if (li) li.classList.add('ativo');
    const fd = new Map();
    const base = {nome:S.nome, empresa:(it.cli_conf === 'SIM' ? it.cli_sis : S.empresa), empresa_sis:it.cli_sis, empresa_conf:it.cli_conf, empresa_cad:(it.cli_conf === 'SIM' ? 'OK' : (S.emp_check || '')), cel:S.cel, email:S.email, origem:S.origem, equip:S.equips[i],
                  tag:it.tag, marca:it.marca, modelo:it.modelo, serie:it.serie, tipo:'COR', parado:it.parado, cat:it.cat, relato:it.relato};
    Object.entries(base).forEach(([k, v]) => fd.set(k, v || ''));
    const vivas = it.midias.filter(m => !m.removida);
    fd.set('midias', vivas.filter(m => m.status === 'ok').map(m => m.mid).join(','));
    fd.set('midias_falha', String(vivas.filter(m => m.status !== 'ok').length));
    r_falhas += vivas.filter(m => m.status !== 'ok').length;
    let r = null;
    for (let t = 0; t < 4 && !r; t++) {        // v25: o pedido precisa chegar na nuvem (tenta 4 vezes)
      try { const j = await apiPost('atendimento', {dados: Object.fromEntries(fd)}); if (j.ok) r = j; }
      catch (err) { await dormir(2500 * (t + 1)); }
    }
    if (!r) r = {protocolo:'', erro:'sem conexão'};
    online = online || !!r.robo_online;
    console.log('Pedido na nuvem – item ' + (i + 1) + ':', r);
    RES.push({protocolo: r.protocolo || '', numero_ss: '', salva: false, repetida: false, erro: r.erro || ''});
  }
  // v25: o robô do PC abre as SS; espera o nº (até 3 min se o PC estiver ligado)
  const ids = RES.map(r => r.protocolo).filter(Boolean), t0 = Date.now(), lim = online ? 180000 : 8000;
  const st = document.getElementById('midst');
  if (!ids.length) { RES.forEach(r => r.erro = r.erro || 'sem conexão'); }
  while (ids.length && Date.now() - t0 < lim) {
    try {
      const j = await apiGet('status', {ids: ids.join(',')});
      RES.forEach((r, i) => { const x = (j.resultados || {})[r.protocolo]; if (x && !r._ok) {
        r._ok = true; Object.assign(r, {numero_ss: x.numero_ss || '', salva: !!x.salva, repetida: !!x.repetida});
        const li = document.getElementById('ck' + i);
        if (li) { li.classList.add('done'); li.textContent += r.numero_ss ? ' → SS ' + r.numero_ss : ' → protocolo ' + r.protocolo; } } });
      if (RES.every(r => r._ok || !r.protocolo)) break;
      if (!j.robo_online && Date.now() - t0 > 8000) break;
    } catch (e) {}
    if (st) st.textContent = 'Abrindo a SS no sistema…';
    await dormir(3000);
  }
  RES.forEach((r, i) => { const li = document.getElementById('ck' + i);
    if (li && !li.classList.contains('done')) { li.classList.add('done'); li.textContent += r.protocolo ? ' → protocolo ' + r.protocolo : ' → falha de conexão'; } });
  if (st) st.textContent = '';
  setTimeout(() => go('fim'), 900);
}

const AFTER = {
  orc(){ mascaraCel(document.getElementById('cel'));
    document.getElementById('enviarOrc').onclick = e => { if (validar(['empresa','cel','necessidade'])){ ler(['email']); e.target.disabled = true; e.target.textContent = 'Enviando…';
      apiPost('orcamento', {dados: {nome:S.nome, empresa:S.empresa, cel:S.cel, email:S.email, necessidade:S.necessidade}})
        .then(j => { if (!j.ok) throw new Error(j.erro); _prot = j.protocolo; go('fimorc'); })
        .catch(() => { e.target.disabled = false; e.target.textContent = 'Enviar pedido'; document.getElementById('err').textContent = 'Não conseguimos enviar agora. Verifique sua conexão e tente novamente.'; });
    } }; },
  equip(){
    document.getElementById('eqOk').onclick = () => {
      if (!S.equips.length) { document.getElementById('err').textContent = 'Marque pelo menos um equipamento.'; return; }
      S.itens = S.itens.slice(0, S.equips.length); S.k = 0; carregarItem(0);
      if (QR_TAG && S.origem === 'LOC' && !S.tag && !(S.itens[0] && S.itens[0].tag)) S.tag = QR_TAG;   // v25: veio do QR Code
      go('ident');
    };
  },
  dados(){ mascaraCel(document.getElementById('cel')); },
  relato(){
    document.querySelectorAll('.fmid').forEach(inp => {
      inp.addEventListener('click', () => { ler(['relato']); salvarEstado(); });   // v26: guarda tudo antes de abrir câmera/galeria
      inp.onchange = async ev => {
        ler(['relato']);
        const lista = [...ev.target.files]; ev.target.value = '';
        await escolherArquivos(lista);
        salvarEstado();
      };
    });
  },

  revisao(){ document.getElementById('enviarAt').onclick = e => { e.target.disabled = true; e.target.textContent = 'Enviando…'; go('proc'); }; },
  proc(){ enviarItens(); },
  fim(){
    document.querySelectorAll('.copy[data-n]').forEach(b => b.onclick = () => {
      const n = b.dataset.n;
      try { navigator.clipboard.writeText(n).then(() => b.textContent = 'Copiado ✓', () => b.textContent = n); }
      catch { b.textContent = n; }
    });
  }
};
