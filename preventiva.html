<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manutenção Preventiva – FF Logística</title>
<!-- v1 (27/10/2026): página do cliente para confirmar/reagendar a preventiva.
     Conversa com o Apps Script (email_preventiva_v4) sem usar o login Google do navegador. -->
<style>
  body{margin:0;background:#EEF1F5;color:#14202C;font:16px/1.5 Arial,sans-serif}
  header{background:#1B2A3A;color:#fff;padding:12px 16px;font-weight:bold;font-size:20px}
  header b{color:#F2B705}
  .st{height:6px;background:repeating-linear-gradient(-45deg,#F2B705 0 10px,#1B2A3A 10px 20px)}
  main{max-width:520px;margin:0 auto;padding:16px}
  .c{background:#fff;border:1px solid #D6DDE5;border-radius:12px;padding:16px;margin-bottom:12px}
  h1{font-size:22px;margin:0 0 8px}
  td{padding:4px 10px 4px 0;vertical-align:top}
  td:first-child{color:#5B6B7B}
  button{font:bold 16px Arial;border:0;border-radius:10px;padding:13px;width:100%;margin-top:8px;cursor:pointer;color:#fff}
  button:disabled{opacity:.6;cursor:default}
  .s{background:#2E7D4F}.n{background:#C53030}.v{background:#fff;color:#14202C;border:1.5px solid #D6DDE5}
  label{display:block;margin-top:10px;font-weight:bold;font-size:14px}
  input,select,textarea{font:inherit;width:100%;box-sizing:border-box;padding:9px;border:1.5px solid #D6DDE5;border-radius:8px;margin-top:4px}
  .e{color:#C53030;font-weight:bold;margin-top:8px}
  .ok{color:#2E7D4F;font-weight:bold}
  .r{border-left:4px solid #F2B705;background:#FFF8E1;padding:10px 12px;font-size:13px;margin-top:12px;white-space:pre-line}
  .p{color:#5B6B7B;font-size:14px}
  [hidden]{display:none!important}
</style>
</head>
<body>
<header>FF <b>LOGÍSTICA</b></header>
<div class="st"></div>
<main><div class="c" id="caixa"><p class="p">Carregando o agendamento…</p></div></main>

<script>
(function () {
  // Endereço do Apps Script (implantação "Preventiva v2", código AKfycbyaXnUy6...)
  var API = 'https://script.google.com/macros/s/AKfycbyaXnUy6HkHh57YlOS-hyCjy9hf7SqSovMfU7oyTiswaGbS7ah4gfPZcOc-O4dLJ9yq/exec';
  var WHATS = '(21) 98103-8612';

  var q = new URLSearchParams(location.search);
  var ID = q.get('id') || '', T = q.get('t') || '', R = q.get('r') || '';
  var caixa = document.getElementById('caixa');

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function $(i) { return document.getElementById(i); }

  function chamar(params) {
    params.id = ID; params.t = T;
    var url = API + '?' + new URLSearchParams(params).toString();
    // credentials 'omit': não usa as contas Google do navegador (evita o erro com várias contas logadas)
    return fetch(url, { method: 'GET', credentials: 'omit', redirect: 'follow' }).then(function (r) {
      if (!r.ok) throw new Error('Falha de comunicação (' + r.status + ').');
      return r.json();
    });
  }

  function aviso(titulo, msg, classe) {
    caixa.innerHTML = '<h1>' + esc(titulo) + '</h1><p class="' + (classe || '') + '">' + esc(msg) + '</p>';
  }

  function resumo(p) {
    return '<table>' + [['Cliente', p.cliente], ['Equipamento (TAG)', p.tag], ['Data', p.data], ['Hora', p.hora]].map(function (l) {
      return '<tr><td>' + l[0] + '</td><td><b>' + esc(l[1]) + '</b></td></tr>';
    }).join('') + '</table>';
  }

  function montar(d) {
    var resp = d.responsabilidade ? '<div class="r">' + esc(d.responsabilidade) + '</div>' : '';
    caixa.innerHTML = '<h1>Confirma o agendamento da Manutenção Preventiva?</h1>' + resumo(d.p)
      + '<label>Seu nome<input id="nome" maxlength="80" autocomplete="name"></label>'
      + '<div id="esc"' + (R === 'nao' ? ' hidden' : '') + '><button class="s" id="bSim">✔ Sim, confirmo</button><button class="n" id="bNao">✖ Não, preciso reagendar</button></div>'
      + '<div id="fNao"' + (R === 'nao' ? '' : ' hidden') + '>'
      + '<label>Data desejada<input id="data" type="date" min="' + esc(d.hoje) + '"></label>'
      + '<label>Horário preferido (opcional)<input id="hora" type="time"></label>'
      + '<label>Motivo<select id="motivo"><option value="">Escolha…</option>'
      + (d.motivos || []).map(function (m) { return '<option>' + esc(m) + '</option>'; }).join('') + '</select></label>'
      + '<label>Descreva (obrigatório se "Outro")<textarea id="obs" maxlength="500" rows="3"></textarea></label>'
      + resp
      + '<button class="n" id="bEnvNao">Enviar pedido de reagendamento</button><button class="v" id="bVolta">Voltar</button></div>'
      + (R === 'nao' ? '' : resp)
      + '<div class="e" id="err"></div>';

    function enviar(dados, botao) {
      $('err').textContent = '';
      dados.nome = $('nome').value.trim();
      if (dados.nome.length < 2) { $('err').textContent = 'Informe o seu nome.'; $('nome').focus(); return; }
      var txt = botao.textContent;
      botao.disabled = true; botao.textContent = 'Enviando…';
      chamar(dados).then(function (r) {
        if (r && r.ok) aviso('Obrigado!', r.msg, 'ok');
        else if (r && r.msg) aviso('Atenção', r.msg, 'ok');
        else { botao.disabled = false; botao.textContent = txt; $('err').textContent = (r && r.erro) || 'Não foi possível enviar.'; }
      }).catch(function () {
        botao.disabled = false; botao.textContent = txt;
        $('err').textContent = 'Não foi possível enviar. Verifique a internet e tente de novo.';
      });
    }

    if ($('bSim')) {
      $('bSim').onclick = function () { enviar({ api: 'responder', tipo: 'sim' }, this); };
      $('bNao').onclick = function () { $('esc').hidden = true; $('fNao').hidden = false; };
    }
    $('bVolta').onclick = function () { $('fNao').hidden = true; $('esc').hidden = false; };
    $('bEnvNao').onclick = function () {
      var m = $('motivo').value;
      if (!$('data').value) { $('err').textContent = 'Informe a data desejada.'; return; }
      if (!m) { $('err').textContent = 'Escolha o motivo.'; return; }
      if (m.indexOf('Outro') === 0 && $('obs').value.trim().length < 5) { $('err').textContent = 'Descreva o motivo.'; return; }
      enviar({ api: 'responder', tipo: 'nao', data: $('data').value, hora: $('hora').value, motivo: m, obs: $('obs').value }, this);
    };
  }

  if (!ID || !T) { aviso('Link inválido', 'Não encontramos este agendamento. Fale com a FF Logística pelo WhatsApp ' + WHATS + '.'); return; }

  chamar({ api: 'ler' }).then(function (d) {
    if (d.estado === 'aberta') montar(d);
    else if (d.estado === 'respondida') {
      caixa.innerHTML = '<h1>Manutenção Preventiva</h1>' + resumo(d.p) + '<p class="ok">' + esc(d.msg) + '</p>'
        + '<p class="p">Para mudar, fale com a FF Logística pelo WhatsApp ' + WHATS + '.</p>';
    }
    else if (d.estado === 'cancelada') aviso('Agendamento cancelado', 'Esta preventiva foi cancelada pela FF Logística.');
    else aviso('Link inválido', 'Não encontramos este agendamento. Fale com a FF Logística pelo WhatsApp ' + WHATS + '.');
  }).catch(function () {
    aviso('Não foi possível carregar', 'Verifique a internet e tente de novo. Se continuar, fale com a FF Logística pelo WhatsApp ' + WHATS + '.');
  });
})();
</script>
</body>
</html>
